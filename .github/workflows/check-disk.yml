name: Check Disk

on:
  workflow_dispatch:

jobs:
  check:
    name: Deep Scan and Clean
    runs-on: ubuntu-24.04

    steps:
      - name: System Info
        run: |
          echo "=== CPU & MEMORY ==="
          lscpu | grep -E "Model name|CPU\(s\):|Thread|Core"
          free -h
          echo "=== DISK AWAL ==="
          df -h /

      - name: Scan Top Folders Before
        run: |
          echo "=== 25 DIREKTORI TERBESAR DI ROOT / ==="
          sudo du -h -d 2 / 2>/dev/null | sort -hr | head -25
          echo "=== 25 DIREKTORI TERBESAR DI /usr ==="
          sudo du -h -d 2 /usr 2>/dev/null | sort -hr | head -25
          echo "=== FILE SATUAN > 100MB DI SELURUH SISTEM ==="
          sudo find / -xdev -type f -size +100M -exec ls -lh {} + 2>/dev/null | sort -k5 -hr | head -30 || true

      - name: Deep Clean Disk
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet            || true
          sudo rm -rf /usr/local/lib/android       || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup   || true
          sudo rm -rf /opt/hostedtoolcache         || true
          sudo rm -rf /usr/local/share/boost       || true
          sudo rm -rf /opt/az /usr/share/miniconda || true
          sudo rm -rf /usr/local/share/powershell  || true
          sudo rm -rf /usr/local/go                || true
          sudo rm -rf /usr/share/swift             || true
          sudo rm -rf /usr/local/share/chromium    || true
          sudo rm -rf /opt/microsoft               || true
          sudo rm -rf /var/lib/docker/* /var/lib/containerd/* || true
          sudo docker image prune -af              || true

          sudo rm -rf /usr/lib/llvm-*              || true
          sudo rm -rf /usr/src/linux-headers-*     || true
          sudo rm -rf /usr/share/man /usr/share/doc || true
          sudo rm -rf /usr/local/share/.cache /root/.cache /home/runner/.cache || true
          sudo rm -rf /var/lib/snapd /snap         || true
          sudo rm -rf /usr/lib/jvm/temurin-* /usr/lib/jvm/*graalvm* || true
          sudo rm -rf /usr/share/php* /usr/lib/php* || true

          sudo apt-get clean                       || true
          sudo rm -rf /var/lib/apt/lists/*         || true
          sudo journalctl --vacuum-size=10M        || true

      - name: Scan Remaining
        run: |
          echo "=== DISK SESUDAH DIBERSIHKAN ==="
          df -h /
          echo "=== 20 DIREKTORI TERBESAR YANG MASIH TERSISA ==="
          sudo du -h -d 2 / 2>/dev/null | sort -hr | head -20
          echo "=== SISA RUANG TERSEDIA ==="
          df -BG --output=avail / | tail -1 | tr -dc '0-9' | awk '{print $1 " GB ruang kosong murni siap dipakai"}'
